; Local development config only — the CloudPepper server has its own.
; Never put production credentials in this file; it is committed to git.
[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
admin_passwd = admin
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
dbfilter = .*
list_db = True
log_level = info
workers = 0
max_cron_threads = 1
